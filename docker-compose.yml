services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: business_card
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card -d business_card"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://card:card@db:5432/business_card?schema=public
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
